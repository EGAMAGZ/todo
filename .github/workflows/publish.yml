name: "The Procrastination Publisher"
description: "Releases your TODO library to the world, because someone has to enable procrastination at scale."

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  run-tests:
    name: "Pretending to Run Tests Before Publishing"
    permissions:
      contents: read
    uses: ./.github/workflows/test.yml

  publish:
    name: "Unleashing Procrastination Upon the World"
    runs-on: ubuntu-latest
    needs: [run-tests]

    permissions:
      contents: read
      id-token: write

    steps:
      - name: "Checkout the code (reluctantly)"
        uses: actions/checkout@v4

      - name: "Publish package (because we can't procrastinate forever)"
        run: npx jsr publish
        env:
          NODE_DEBUG: "procrastination" # Enable detailed procrastination logging
