name: "The Procrastination Checker"
description: "Makes sure your TODO functions are actually throwing errors as expected. Because we can't even trust our own laziness."

on:
  workflow_call:
  pull_request:
    branches:
      - "**"
  push:
    branches:
      - master

jobs:
  test:
    name: "Pretending to Care About Code Quality"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout the code (if we must)"
        uses: actions/checkout@v4
        
      - name: "Install Deno (because we're fancy like that)"
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          
      - name: "Run tests (or at least pretend to)"
        run: deno test
        continue-on-error: true # Because sometimes even our tests are too lazy to pass
